plugins { id 'com.android.application' }
android {
    namespace 'app.kaze.watch'
    compileSdk 35
    defaultConfig { applicationId 'app.kaze.trail'; minSdk 28; targetSdk 35; versionCode 1; versionName '0.1' }
    buildTypes { debug { manifestPlaceholders = [cleartextAllowed: 'true'] }; release { manifestPlaceholders = [cleartextAllowed: 'false'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation project(':shared'); implementation 'com.google.android.gms:play-services-wearable:19.0.0' }
